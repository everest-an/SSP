name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Save SSH key
          echo "$EC2_SSH_KEY" > /tmp/ec2_key.pem
          chmod 400 /tmp/ec2_key.pem
          
          # Deploy via SSH
          ssh -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            cd /home/ec2-user/SSP || cd ~/SSP
            git pull origin main
            pnpm install || npm install
            pnpm run build || npm run build
            pm2 restart ssp || pm2 start npm --name ssp -- start
            echo "✅ Deployment completed successfully!"
          EOF
          
          # Clean up
          rm -f /tmp/ec2_key.pem
      
      - name: Deployment completed
        run: echo "✅ Deployment to EC2 completed successfully!"
